# Production stack on the VPS. Lives in /opt/portfolio/app/deploy; state stays outside the code:
# /opt/portfolio/{.env, data, uploads, backups}. See deploy/README.md.
name: portfolio

services:
  api:
    build: ../backend
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:4000/api/health').then(r=>process.exit(r.ok?0:1),()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 6
    env_file: /opt/portfolio/.env
    environment:
      PORT: "4000"
      DATABASE_PATH: /app/data/portfolio.db
      UPLOAD_DIR: /app/uploads
      TRUST_PROXY: "1"
    volumes:
      - /opt/portfolio/data:/app/data
      - /opt/portfolio/uploads:/app/uploads

  web:
    build: ..
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    environment:
      API_URL: http://api:4000
      SITE_URL: ${SITE_URL:-}
    depends_on:
      api:
        condition: service_healthy

  caddy:
    image: caddy:2.8-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS:-:80}
      # Unused port inside the container until a www domain is set.
      REDIRECT_ADDRESS: ${REDIRECT_ADDRESS:-:8081}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - /opt/portfolio/uploads:/srv/uploads:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - web
      - api

volumes:
  caddy_data:
  caddy_config:
